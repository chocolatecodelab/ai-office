# One Hermes Agent container per brand (blueprint Bab 14). Spike L0 runs hermes-otca only.
# The api reaches it on the internal network through Hermes' OpenAI-compatible API server.
services:
  hermes-otca:
    # nousresearch/hermes-agent:latest as of 2 Nov 2026, pinned by digest (SEC-12).
    image: nousresearch/hermes-agent@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file: env/hermes-otca.env
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
    volumes:
      - ../context/_shared:/context/_shared:ro
      - ../context/agents:/context/agents:ro
      - ../context/brands/otca:/brand:ro
      - ../data/otca:/opt/data
    depends_on:
      litellm:
        condition: service_healthy
    mem_limit: 1536m
